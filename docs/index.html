<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChromaClock Wide Preview</title><style>body{background:#11131b;color:#eef3ff;font:16px system-ui;margin:24px auto;max-width:1000px;padding:0 16px}h1{margin-bottom:4px}p{color:#b9c2d2}canvas{image-rendering:pixelated;width:100%;max-width:960px;border:2px solid #353747;border-radius:5px}label{margin-right:12px}select{font-size:16px;background:#242638;color:white;padding:8px;border:1px solid #4c5262;border-radius:6px}small{color:#b9c2d2}</style></head><body><h1>ChromaClock Wide</h1><p>Browser preview for a five-panel 320×32 display. This is illustrative, not a pixel-perfect simulation of the Python/Pillow renderer.</p><p><label>Style <select id="style"></select></label><label>Color <select id="color"><option>rainbow</option><option>cyan</option><option>magenta</option><option>amber</option><option>green</option></select></label></p><canvas id="screen" width="320" height="32"></canvas><p><small>For a live preview on your actual LEDs, enable Preview Mode in the LEDMatrix plugin settings.</small></p><script>const styles=['neon','prism','starfield','matrix','fire','horizon','binary','minimal','pulse','wave','aurora','rain'];const s=document.querySelector('#style');styles.forEach(v=>s.add(new Option(v[0].toUpperCase()+v.slice(1),v)));const c=document.querySelector('#color'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');function rgb(h){return 'hsl('+h+' 100% 62%)'}function render(){const t=Date.now()/1000,w=320,h=32,style=s.value;const colors={cyan:'#20e0ff',magenta:'#ff42af',amber:'#ffb333',green:'#45ff87'};const a=colors[c.value]||rgb(t*5%360);ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);for(let x=0;x<w;x++){if(Math.abs(x-160)<70)continue;const wave=Math.sin(x*.09+t);ctx.fillStyle=style==='matrix'?'#22b854':style==='fire'?'#ff7620':style==='aurora'?'#4affad':style==='prism'?rgb(x*1.2+t*8):a;let y=16+wave*8;if(style==='neon'||style==='prism'){ctx.fillRect(x,1,1,2);ctx.fillRect(x,29,1,2)}else if(style==='starfield'){if(x%5===0)ctx.fillRect(x,(x*23)%32,1,1)}else if(style==='matrix'||style==='rain'){if(x%7===0)ctx.fillRect(x,Math.floor((t*10+x*13)%38)-5,1,5)}else if(style==='fire'||style==='horizon'){ctx.globalAlpha=.5;ctx.fillRect(x,y,1,32-y);ctx.globalAlpha=1}else if(style==='binary'){if(x%8===0)for(let j=0;j<4;j++)if((x+j+Math.floor(t))%3===0)ctx.fillRect(x,3+j*7,3,3)}else if(style==='pulse'){ctx.fillRect(x,16,1,y-16)}else if(style==='wave'||style==='aurora'){ctx.fillRect(x,y,1,1)}else if(x%12===0)ctx.fillRect(x,29,1,1)}const n=new Date();let h12=n.getHours()%12||12,mins=String(n.getMinutes()).padStart(2,'0');ctx.font='bold 21px monospace';ctx.textAlign='center';ctx.fillStyle=a;ctx.fillText(h12+':'+mins,160,23);ctx.font='bold 7px monospace';ctx.fillStyle='#ccccdf';ctx.fillText(n.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).toUpperCase(),160,30);ctx.fillStyle=a;ctx.fillRect(0,31,w*n.getSeconds()/60,1);requestAnimationFrame(render)}requestAnimationFrame(render)</script></body></html>
